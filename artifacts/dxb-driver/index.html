    <!-- LocalBusiness + TaxiService Schema -->
    <script type="application/ld+json">

      "@context": "https://schema.org",

      "email": "dxbdriver@dxbdriver.com",
      "logo": "https://dxbdriver.com/favicon.svg",
      "image": "https://dxbdriver.com/opengraph.jpg",
      "priceRange": "$$",
      "currenciesAccepted": "AED",
      "paymentAccepted": "Cash, Bank Transfer",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "DAMAC Smart Heights, 23rd Floor",
        "addressLocality": "Barsha Heights",
        "addressRegion": "Dubai",
        "addressCountry": "AE"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": "25.0954",
        "longitude": "55.1719"
      },
      "areaServed": [
        { "@type": "City", "name": "Dubai" },
        { "@type": "City", "name": "Abu Dhabi" },
        { "@type": "City", "name": "Sharjah" },
        { "@type": "State", "name": "UAE" }

      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],

      ],
      "contactPoint": [
        {
          "@type": "ContactPoint",
          "telephone": "+971528730883",
          "contactType": "customer service",
          "availableLanguage": ["English", "Spanish"]
        }
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Chauffeur Services Dubai",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Airport Transfer Dubai",
              "description": "Private chauffeur airport transfers from DXB and DWC. Flight tracked, meet and greet, fixed rates."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "City Rides Dubai",
              "description": "Private chauffeur city rides across Dubai. Fixed rates, no surge pricing, bilingual drivers."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Inter-Emirate Transfer",
              "description": "Private chauffeur transfers between Emirates. Dubai to Abu Dhabi, Sharjah and all UAE Emirates."
            }
          }
        ]
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.97",
        "ratingCount": "5000",
        "bestRating": "5",
        "worstRating": "1"
      }
    }
