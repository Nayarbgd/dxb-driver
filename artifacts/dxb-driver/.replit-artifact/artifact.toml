kind = "web"
previewPath = "/"
title = "DXB Driver"
version = "1.0.0"
id = "artifacts/dxb-driver"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26236

[services.development]
run = "pnpm --filter @workspace/dxb-driver run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dxb-driver", "run", "build" ]
publicDir = "artifacts/dxb-driver/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26236"
BASE_PATH = "/"
